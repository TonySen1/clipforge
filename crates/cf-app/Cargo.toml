[package]
name = "cf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "clipforge"
path = "src/main.rs"

[build-dependencies]
# Embeds the window/exe icon into the PE resources. Without it Explorer and
# the taskbar show the generic Windows application icon, because
# `ViewportBuilder::with_icon` only affects the runtime window.
embed-resource = "3"

[dependencies]
cf-core = { path = "../cf-core" }
cf-ui = { path = "../cf-ui" }
eframe = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
dark-light = { workspace = true }
rfd = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
log = { workspace = true }
env_logger = { workspace = true }
cpal = "0.18"
