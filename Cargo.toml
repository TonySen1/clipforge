[workspace]
resolver = "2"
members = [
    "crates/cf-core",
    "crates/cf-ui",
    "crates/cf-app",
    "xtask",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["ClipForge contributors"]
repository = "https://github.com/TonySen1/clipforge"

[workspace.dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rust-i18n = "4.2"
dark-light = "3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rfd = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
