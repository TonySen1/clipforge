<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClipForge · 剪切工具图标</title>
<style>
  :root {
    --ink: #0B1119;
    --ink-2: #131C28;
    --line: #22303F;
    --fg: #E6EEF8;
    --fg-dim: #8496AC;
    --cyan: #5CE1FF;
    --blue: #4F9CFF;
    --violet: #B49BFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--fg);
    font: 14px/1.5 "HarmonyOS Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 40px 32px 64px;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .04em; margin: 0 0 4px; }
  .sub { color: var(--fg-dim); font-size: 12.5px; margin-bottom: 34px; }
  .section-label {
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--fg-dim); margin: 40px 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 12px;
  }
  .cell {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 10px 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--ink-2);
    cursor: pointer;
    transition: border-color .16s, background .16s, transform .16s;
  }
  .cell:hover { border-color: #36506B; transform: translateY(-1px); }
  .cell:active { transform: translateY(0) scale(.985); }
  .cell.copied { border-color: var(--blue); }

  .glyph-box { display: grid; place-items: center; width: 56px; height: 56px; }
  .glyph { width: 32px; height: 32px; color: var(--fg); transition: color .16s; }

  /* 悬停换成品牌渐变描边 */
  .cell:hover .glyph { color: #4F9CFF; }
  .cell:hover .glyph :not([stroke="none"]) { stroke: url(#brand); }
  .cell:hover .glyph [fill="currentColor"] { fill: url(#brand); }

  .name { font-size: 12.5px; font-weight: 500; }
  .zh { font-size: 11px; color: var(--fg-dim); }
  .hint {
    position: absolute; top: 8px; right: 9px;
    font-size: 10px; color: transparent; transition: color .16s;
  }
  .cell.copied .hint { color: var(--blue); }
  .cell:hover .hint { color: #4B6480; }
  .cell.copied:hover .hint { color: var(--blue); }

  .sizes { display: flex; align-items: center; gap: 26px; padding: 20px;
           border: 1px dashed var(--line); border-radius: 12px; }
  .sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sizes figcaption { font-size: 10px; color: #5C6B7E; }

  .light-zone { background: #F4F7FB; color: #16202C; border-radius: 14px; padding: 24px; }
  .light-zone .cell { background: #FFFFFF; border-color: #DCE5F0; color: #1B2A3B; }
  .light-zone .cell:hover { border-color: #9DBBE0; }
  .light-zone .glyph { color: #1B2A3B; }
  .light-zone .zh { color: #6B7C90; }

  .foot { margin-top: 36px; color: #5C6B7E; font-size: 11.5px; }
  code { color: #93A7BE; background: #16202C; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="brand" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1FF"/>
      <stop offset="0.5" stop-color="#4F9CFF"/>
      <stop offset="1" stop-color="#B49BFF"/>
    </linearGradient>
  </defs>
</svg>

<h1>剪切工具图标</h1>
<div class="sub">手绘 24×24 · 线性描边 1.6 · currentColor 着色 · 悬停切换品牌渐变</div>

<div class="section-label">深色工具条</div>
<div class="board" id="dark-board"></div>

<div class="section-label">尺寸检查（split 分割）</div>
<div class="sizes" id="size-row"></div>

<div class="section-label">浅色界面</div>
<div class="light-zone">
  <div class="board" id="light-board"></div>
</div>

<div class="foot">
  文件位于 <code>assets/icons/ui/*.svg</code>，单色描边全部使用 <code>currentColor</code>，可直接被 egui / Web / CSS 着色。点击卡片复制文件名。
</div>

<script>
const ICONS = [
  ["select", "选择工具", `<path d="M6.4 3.1 L6.4 18.7 L10.5 14.6 L13.1 20.5 L15.9 19.1 L13.3 13.5 L18.7 13.1 Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>`],

  ["razor", "剃刀 / 切割", `
    <path d="M10.4 13.6 L19.0 5.0 L21.0 7.0 L12.4 15.6 Z"/>
    <path d="M10.4 13.6 L12.4 15.6"/>
    <path d="M3.0 21.0 L9.2 14.8"/>
    <path d="M20.0 6.0 L21.0 7.0"/>`],

  ["split", "分割", `
    <rect x="2.6" y="4.4" width="6.2" height="15.2" rx="1.4"/>
    <rect x="15.2" y="4.4" width="6.2" height="15.2" rx="1.4"/>
    <path d="M12 1.8 L12 22.2" stroke-width="1.4"/>`],

  ["scissors", "剪刀", `
    <circle cx="6.3" cy="17.9" r="2.5"/>
    <circle cx="17.7" cy="17.9" r="2.5"/>
    <path d="M8.2 16.1 L19.1 4.6"/>
    <path d="M15.8 16.1 L4.9 4.6"/>
    <circle cx="12" cy="10.3" r="1" fill="currentColor" stroke="none"/>`],

  ["crop", "裁剪", `
    <path d="M6.6 3.4 L6.6 17.4 L20.6 17.4"/>
    <path d="M3.4 6.6 L17.4 6.6 L17.4 20.6"/>
    <circle cx="6.6" cy="3.4" r="0.9" fill="currentColor" stroke="none"/>
    <circle cx="20.6" cy="17.4" r="0.9" fill="currentColor" stroke="none"/>`],

  ["trash", "删除片段", `
    <path d="M4.2 6.4 L19.8 6.4"/>
    <path d="M9.4 6.4 L9.4 4.3 C9.4 3.6 9.9 3.1 10.6 3.1 L13.4 3.1 C14.1 3.1 14.6 3.6 14.6 4.3 L14.6 6.4"/>
    <path d="M6.6 6.4 L7.4 19.1 C7.5 20.1 8.3 20.9 9.3 20.9 L14.7 20.9 C15.7 20.9 16.5 20.1 16.6 19.1 L17.4 6.4"/>
    <path d="M10.3 10.4 L10.5 17.2" opacity="0.7"/>
    <path d="M13.7 10.4 L13.5 17.2" opacity="0.7"/>`],

  ["magnet", "吸附", `
    <path d="M4.4 3.8 L4.4 11.6 C4.4 15.8 7.8 19.2 12 19.2 C16.2 19.2 19.6 15.8 19.6 11.6 L19.6 3.8"/>
    <path d="M8.2 3.8 L8.2 11.6 C8.2 13.7 9.9 15.4 12 15.4 C14.1 15.4 15.8 13.7 15.8 11.6 L15.8 3.8"/>
    <path d="M4.4 7.4 L8.2 7.4"/>
    <path d="M15.8 7.4 L19.6 7.4"/>`],

  ["speed", "变速", `
    <path d="M3.6 17.6 C3.6 12.9 7.3 9.2 12 9.2 C16.7 9.2 20.4 12.9 20.4 17.6"/>
    <path d="M4.9 17.6 L3.6 17.6"/>
    <path d="M19.1 17.6 L20.4 17.6"/>
    <path d="M12 17.6 L16.1 12.9"/>
    <circle cx="12" cy="17.6" r="1.3" fill="currentColor" stroke="none"/>
    <path d="M6.1 11 L5.1 10" opacity="0.7"/>
    <path d="M17.9 11 L18.9 10" opacity="0.7"/>`],

  ["undo", "撤销", `
    <path d="M8.2 7.3 L4.1 11.4 L8.2 15.5"/>
    <path d="M4.1 11.4 L14.6 11.4 C17.5 11.4 19.9 13.8 19.9 16.7 C19.9 19.1 18 21 15.6 21 L12.2 21"/>`],

  ["redo", "重做", `
    <path d="M15.8 7.3 L19.9 11.4 L15.8 15.5"/>
    <path d="M19.9 11.4 L9.4 11.4 C6.5 11.4 4.1 13.8 4.1 16.7 C4.1 19.1 6 21 8.4 21 L11.8 21"/>`],
];

const SPLIT_BODY = ICONS.find(i => i[0] === "split")[2];

function glyph(body, size) {
  return `<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
              style="width:${size}px;height:${size}px">${body}</svg>`;
}

function makeCell([file, zh, body], size) {
  const el = document.createElement("div");
  el.className = "cell";
  el.innerHTML = `
    <span class="hint">点击复制</span>
    <div class="glyph-box">${glyph(body, size)}</div>
    <span class="name">${file}.svg</span>
    <span class="zh">${zh}</span>`;
  el.addEventListener("click", () => {
    navigator.clipboard?.writeText(`assets/icons/ui/${file}.svg`).catch(() => {});
    el.classList.add("copied");
    const hint = el.querySelector(".hint");
    hint.textContent = "已复制";
    setTimeout(() => { el.classList.remove("copied"); hint.textContent = "点击复制"; }, 1200);
  });
  return el;
}

const dark = document.getElementById("dark-board");
const light = document.getElementById("light-board");
ICONS.forEach(ic => {
  dark.appendChild(makeCell(ic, 32));
  light.appendChild(makeCell(ic, 32));
});

const row = document.getElementById("size-row");
[16, 20, 24, 32, 40, 48].forEach(s => {
  const f = document.createElement("figure");
  f.innerHTML = `${glyph(SPLIT_BODY, s)}<figcaption>${s}px</figcaption>`;
  f.querySelector("svg").style.color = "#E6EEF8";
  row.appendChild(f);
});
</script>
</body>
</html>
